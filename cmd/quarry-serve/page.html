<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quarry search</title>
<style>
  @font-face {
    font-family: "Bricolage Grotesque";
    src: url("/fonts/bricolage-grotesque.woff2") format("woff2");
    font-weight: 400 800;
    font-display: swap;
  }
  :root {
    color-scheme: light;
    --bg: #f6f7fb; --fg: #0f1530; --muted: #5b6283;
    --cobalt: #2a44ff; --mint: #2fd6a3; --card: #ffffff; --error: #c4302b;
    --shadow: 0 4px 20px rgba(15, 21, 48, 0.06);
    --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font); }
  .backdrop { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; }
  .backdrop::before {
    content: ""; position: absolute; width: 560px; height: 560px; top: -180px; right: -140px;
    background: radial-gradient(circle, rgba(47, 214, 163, 0.35), rgba(42, 68, 255, 0.18) 55%, transparent 70%);
    filter: blur(40px); animation: drift 12s ease-in-out infinite alternate;
  }
  body { isolation: isolate; }
  main { max-width: 860px; margin: 0 auto; padding: 40px 20px 56px; }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -1.5px; }
  h1 span { color: var(--cobalt); }
  .health { display: flex; align-items: center; gap: 8px; padding: 9px 12px;
    border-radius: 999px; background: var(--card); box-shadow: var(--shadow);
    color: var(--muted); font: 12px var(--mono); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .health.online .dot { background: var(--mint); }
  .tagline { margin: 10px 0 42px; color: var(--muted); font-size: 15px; }
  .label { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
  .query-field { position: relative; margin: 8px 0 22px; }
  input[type=search] {
    width: 100%; min-width: 0; padding: 10px 80px 16px 0;
    font: 800 clamp(30px, 5.6vw, 54px)/1.05 var(--font); letter-spacing: -1.5px;
    color: var(--fg); background: transparent; border: 0; border-bottom: 4px solid var(--fg); border-radius: 0;
  }
  input[type=search]::placeholder { color: var(--muted); opacity: 1; }
  input[type=search]:focus { border-bottom-color: var(--cobalt); }
  input[type=search]:focus-visible { outline: 2px solid transparent; border-bottom-color: var(--cobalt);
    background: rgba(42, 68, 255, 0.06); box-shadow: 0 2px 0 var(--cobalt); }
  /* Offset half the extra bottom padding and border to center on the text. */
  .enter-hint { position: absolute; right: 0; top: calc(50% - 5px); transform: translateY(-50%);
    pointer-events: none; color: var(--muted); font: 11px var(--mono); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .segments { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; margin: 0; padding: 0; border: 0; }
  .segments label { position: relative; display: flex; }
  .segments span { display: block; padding: 10px 14px; border-radius: 999px;
    background: var(--card); color: var(--fg); box-shadow: var(--shadow);
    font-size: 12px; font-weight: 600; line-height: 20px; cursor: pointer; }
  .segments input, .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
  }
  .segments input:checked + span { background: var(--fg); color: var(--card); }
  :focus-visible, .segments input:focus-visible + span { outline: 2px solid var(--cobalt); outline-offset: 3px; }
  select, button { padding: 10px 14px; font: 600 12px/20px var(--font); color: var(--fg);
    background: var(--card); border: 0; border-radius: 999px; box-shadow: var(--shadow); }
  button { cursor: pointer; }
  .submit { margin-left: auto; padding-inline: 26px; background: var(--cobalt); color: var(--card);
    box-shadow: 0 5px 18px rgba(42, 68, 255, 0.25); }
  #status { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 24px;
    padding: 26px 0; min-height: 80px; color: var(--muted); font-size: 13px; font-weight: 600; }
  #status.error { color: var(--error); }
  .latency { color: var(--cobalt); font-size: 40px; font-weight: 800; letter-spacing: -1.5px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { margin-bottom: 12px; padding: 18px 20px; border-radius: 18px; background: var(--card);
    box-shadow: var(--shadow); animation: rise 420ms ease-out both; animation-delay: var(--delay);
    transition: translate 180ms ease, box-shadow 180ms ease; }
  li:hover { translate: 0 -3px; box-shadow: 0 10px 28px rgba(15, 21, 48, 0.12); }
  .rank { padding: 1px 7px; border-radius: 999px; background: var(--fg); color: var(--card);
    font: 600 11px/22px var(--font); }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    color: var(--muted); font: 12px/22px var(--mono); overflow-wrap: anywhere; }
  .score-track { width: 80px; height: 6px; border-radius: 999px; background: #e6e9f4; overflow: hidden; }
  .score-bar { display: block; height: 100%; border-radius: inherit;
    background: linear-gradient(90deg, var(--cobalt), var(--mint)); transform-origin: left;
    animation: grow 420ms ease-out both; animation-delay: var(--delay); }
  .title { font-size: 19px; font-weight: 700; margin: 10px 0 4px; overflow-wrap: anywhere; }
  .text { margin: 4px 0; color: #343b5c; white-space: pre-line; overflow-wrap: anywhere; }
  mark { color: inherit; background: rgba(47, 214, 163, 0.28); }
  .more { padding: 2px 0; border: 0; background: transparent; color: var(--cobalt); box-shadow: none; }
  .examples { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .examples[hidden] { display: none; }
  .examples button { color: var(--muted); text-align: left; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid #e6e9f4;
    color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  footer a { color: var(--cobalt); }
  @keyframes drift { to { transform: translate(-80px, 70px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (max-width: 540px) {
    main { padding-top: 20px; }
    .enter-hint { display: none; }
    input[type=search] { padding-right: 0; }
    .segments { width: 100%; gap: 6px; }
    .segments label { flex: 1; }
    .segments span { display: flex; align-items: center; justify-content: center;
      width: 100%; padding: 9px 8px; text-align: center; font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    li:hover { translate: none; }
  }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<main>
  <header>
    <div class="header-row">
      <h1>quarry<span>.</span></h1>
      <div class="health" id="health">
        <span class="dot" aria-hidden="true"></span><span id="documents">— docs</span>
      </div>
    </div>
    <p class="tagline" id="tagline">A disk-based search engine written from scratch in Go.</p>
  </header>
  <form id="form">
    <label class="label" for="q">Search query</label>
    <div class="query-field">
      <input type="search" id="q" name="q" placeholder="Search"
             maxlength="1000" autofocus required>
      <span class="enter-hint" aria-hidden="true">enter ⏎</span>
    </div>
    <div class="controls">
      <fieldset class="segments">
        <legend class="visually-hidden">Retrieval algorithm</legend>
        <label><input type="radio" name="algo" value="bmw" checked><span>Block-Max WAND</span></label>
        <label><input type="radio" name="algo" value="wand"><span>WAND</span></label>
        <label><input type="radio" name="algo" value="exhaustive"><span>Exhaustive</span></label>
      </fieldset>
      <select id="k" name="k" aria-label="Number of results">
        <option value="10">10 results</option>
        <option value="50">50 results</option>
        <option value="100">100 results</option>
      </select>
      <button class="submit" type="submit">Search</button>
    </div>
  </form>
  <div id="status" role="status"></div>
  <div class="examples" id="examples">
    <span class="label">Try</span>
    <button type="button">vitamin d bone density</button>
    <button type="button">sleep deprivation memory</button>
    <button type="button">antibiotic resistance</button>
  </div>
  <ol id="results"></ol>
  <footer>
    Source and design notes: <a href="https://github.com/ethantao14/quarry">github.com/ethantao14/quarry</a>.
    Demo datasets come from the BEIR benchmark; SciFact is by AI2 under CC BY-NC 2.0.
    Type: Bricolage Grotesque (SIL OFL 1.1).
  </footer>
</main>
<script>
"use strict";
// All document text is inserted with textContent, never as HTML.
const algoNames = { bmw: "Block-Max WAND", wand: "WAND", exhaustive: "Exhaustive" };
const snippetChars = 320;
const stopwords = new Set([
  "a", "an", "and", "are", "as", "at", "be", "but", "by", "for", "if",
  "in", "into", "is", "it", "no", "not", "of", "on", "or", "such", "that",
  "the", "their", "then", "there", "these", "they", "this", "to", "was", "will", "with"
]);
const form = document.getElementById("form");
const status = document.getElementById("status");
const list = document.getElementById("results");
const examples = document.getElementById("examples");

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function showStatus(message, isError) {
  status.textContent = message;
  status.classList.toggle("error", isError);
}

function queryPattern(query) {
  const words = query.normalize("NFC").split(/[^\p{L}\p{N}]+/u);
  const seen = new Set();
  const unique = [];
  for (const word of words) {
    const lowercase = word.toLowerCase();
    if (word.length < 2 || stopwords.has(lowercase) || seen.has(lowercase)) continue;
    seen.add(lowercase);
    unique.push(word);
  }
  if (unique.length === 0) return null;
  // Escape regex special characters defensively.
  const escaped = unique.map((word) => word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  return new RegExp("(^|[^\\p{L}\\p{N}])(" + escaped.join("|") + ")(?=$|[^\\p{L}\\p{N}])", "giu");
}

function highlight(node, text, pattern) {
  text = text.normalize("NFC");
  node.replaceChildren();
  if (!pattern) {
    node.textContent = text;
    return;
  }
  let offset = 0;
  for (const match of text.matchAll(pattern)) {
    const start = match.index + match[1].length;
    node.append(document.createTextNode(text.slice(offset, start)));
    const mark = document.createElement("mark");
    mark.textContent = match[2];
    node.append(mark);
    offset = start + match[2].length;
  }
  node.append(document.createTextNode(text.slice(offset)));
}

function renderText(item, text, pattern) {
  // Stored BEIR documents have the title on the first line.
  const newline = text.indexOf("\n");
  let body = text;
  if (newline > 0) {
    const title = element("div", "title");
    highlight(title, text.slice(0, newline), pattern);
    item.append(title);
    body = text.slice(newline + 1);
  }
  const paragraph = element("p", "text");
  const preview = body.slice(0, snippetChars).trimEnd() + "…";
  highlight(paragraph, body.length <= snippetChars ? body : preview, pattern);
  item.append(paragraph);
  if (body.length <= snippetChars) return;
  const toggle = element("button", "more", "Show more");
  toggle.type = "button";
  toggle.setAttribute("aria-expanded", "false");
  toggle.addEventListener("click", () => {
    const expanded = toggle.textContent === "Show less";
    highlight(paragraph, expanded ? preview : body, pattern);
    toggle.textContent = expanded ? "Show more" : "Show less";
    toggle.setAttribute("aria-expanded", String(!expanded));
  });
  item.append(toggle);
}

function animateLatency(node, took) {
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  if (reducedMotion.matches) return;
  const start = performance.now();
  node.textContent = "0.00 ms";
  function tick(now) {
    if (!node.isConnected) return;
    const progress = Math.min(1, (now - start) / 500);
    const eased = 1 - Math.pow(1 - progress, 3);
    node.textContent = (took * eased).toFixed(2) + " ms";
    if (progress < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function render(data, query) {
  list.replaceChildren();
  const count = data.results.length;
  const label = count === 1 ? "1 result" : count + " results";
  showStatus("", false);
  const time = data.took_ms.toFixed(2) + " ms";
  const algorithm = element("span", "algorithm", algoNames[data.algo]);
  const latency = element("span", "latency", time);
  const resultCount = element("span", "result-count", label);
  for (const metric of [latency, algorithm, resultCount]) {
    metric.setAttribute("aria-hidden", "true");
  }
  const announcement = element("span", "visually-hidden",
    "Latency " + time + ", " + algoNames[data.algo] + ", " + label);
  status.append(latency, algorithm, resultCount, announcement);
  animateLatency(latency, data.took_ms);
  const pattern = queryPattern(query);
  const topScore = data.results.length ? data.results[0].score : 0;
  for (const result of data.results) {
    const item = element("li");
    item.style.setProperty("--delay", Math.min(list.children.length, 9) * 60 + "ms");
    const content = element("div", "result-content");
    const meta = element("div", "meta");
    const track = element("span", "score-track");
    track.setAttribute("aria-hidden", "true");
    const bar = element("span", "score-bar");
    const ratio = topScore > 0 ? result.score / topScore : 0;
    bar.style.width = Math.max(0, Math.min(1, ratio)) * 100 + "%";
    track.append(bar);
    meta.append(element("span", "rank", String(result.rank).padStart(2, "0")),
      element("span", "score", "score " + result.score.toFixed(4)),
      element("span", "doc", "doc " + result.id), track);
    content.append(meta);
    if (typeof result.text === "string") renderText(content, result.text, pattern);
    item.append(content);
    list.append(item);
  }
}

// Each search or navigation bumps this, so a slower earlier response is dropped.
let generation = 0;

async function search(params) {
  const current = ++generation;
  examples.hidden = true;
  showStatus("Searching…", false);
  try {
    const response = await fetch("/search?" + params.toString());
    const data = await response.json();
    if (current !== generation) return;
    if (!response.ok) {
      list.replaceChildren();
      showStatus("Error: " + data.error, true);
      return;
    }
    render(data, params.get("q"));
  } catch (err) {
    if (current !== generation) return;
    list.replaceChildren();
    showStatus("Could not reach the server.", true);
  }
}

function paramsFromForm() {
  return new URLSearchParams({
    q: document.getElementById("q").value,
    algo: document.querySelector('input[name="algo"]:checked').value,
    k: document.getElementById("k").value,
  });
}

const defaults = { q: "", algo: "bmw", k: "10" };

function loadFromURL() {
  // Missing or unknown values fall back to defaults, so a URL always means the same search.
  const params = new URLSearchParams(window.location.search);
  document.getElementById("q").value = params.get("q") || defaults.q;
  const algorithm = params.get("algo");
  const allowedAlgorithm = Object.prototype.hasOwnProperty.call(algoNames, algorithm) ? algorithm : defaults.algo;
  for (const radio of document.querySelectorAll('input[name="algo"]')) {
    radio.checked = radio.value === allowedAlgorithm;
  }
  const limit = params.get("k");
  document.getElementById("k").value = ["10", "50", "100"].includes(limit) ? limit : defaults.k;
  if (params.get("q")) {
    search(paramsFromForm());
  } else {
    generation++;
    list.replaceChildren();
    showStatus("", false);
    examples.hidden = false;
  }
}

function submitSearch() {
  const params = paramsFromForm();
  // Keep the query in the address bar so a search can be shared or reloaded.
  history.pushState(null, "", "/?" + params.toString());
  search(params);
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  submitSearch();
});
window.addEventListener("popstate", loadFromURL);

for (const button of examples.querySelectorAll("button")) {
  button.addEventListener("click", () => {
    document.getElementById("q").value = button.textContent;
    submitSearch();
  });
}

fetch("/healthz").then((response) => {
  if (!response.ok) throw new Error("Health check failed");
  return response.json();
}).then((data) => {
  document.getElementById("documents").textContent = data.documents.toLocaleString() + " docs";
  document.getElementById("health").classList.add("online");
}).catch(() => {
  document.getElementById("documents").textContent = "offline";
});
loadFromURL();
</script>
</body>
</html>
